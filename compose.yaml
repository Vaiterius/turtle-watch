services:
  turtlewatch:
    build: .
    image: turtlewatch
    container_name: turtlewatch
    restart: unless-stopped
    # Must own ./data on the host. The first Raspberry Pi user is 1000:1000.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8000}:8000"
    environment:
      SHELLY_HOST: ${SHELLY_HOST:-}
      SHELLY_TEMPERATURE_ID: ${SHELLY_TEMPERATURE_ID:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/app/data
    # Nothing but ./data can be written, so data can never land in the container layer.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Healthy means the web server and database work. A missing sensor is not unhealthy.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
